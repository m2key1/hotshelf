jellyfin:
  url: http://jellyfin:8096
  api_key: ""
  union_prefix: /data/media

branches:
  nvme: /branches/nvme
  hdd: /branches/hdd

budget:
  mode: size
  size_gb: 150
  max_series: 10
  max_movies: 5

policy:
  activity_window_days: 30
  episodes_ahead: 3
  resume: recent
  fresh_imports: keep
  fresh_keep_days: 14
  watched_grace_days: 7
  users: []
  move_sidecars: true

run:
  interval_minutes: 15
  dry_run: true
