jellyfin:
  url: http://jellyfin:8096
  api_key: ""
  union_prefix: /data/media

branches:
  fast: /branches/fast
  slow: /branches/slow

budget:
  mode: size
  size_gb: 150
  max_titles: 15

policy:
  activity_window_days: 30
  episodes_ahead: 3
  resume: recent
  fresh_imports: keep
  fresh_keep_days: 14
  watched_grace_days: 7
  users: []
  move_sidecars: true

run:
  interval_minutes: 15
  dry_run: true
  move_window_enabled: false
  move_window_start: "02:00"
  move_window_end: "07:00"

library:
  movies_dir: movies

mover:
  verify: checksum
  free_space_margin_gb: 1
