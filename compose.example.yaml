services:
  hotshelf:
    build: .
    container_name: hotshelf
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: ${TZ}
      HOTSHELF_JELLYFIN_KEY: ${HOTSHELF_JELLYFIN_KEY}
    volumes:
      - ./config:/config
      - /fast/media-cache:/branches/fast
      - /data/media-hdd:/branches/slow
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hotshelf.rule=Host(`hotshelf.${DOMAIN}`)"
      - "traefik.http.routers.hotshelf.entrypoints=websecure"
      - "traefik.http.routers.hotshelf.middlewares=internal-only@file"
      - "traefik.http.routers.hotshelf.tls=true"
      - "traefik.http.services.hotshelf.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true
